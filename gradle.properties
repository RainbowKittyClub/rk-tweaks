# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft ships deobfuscated since 26.1, so there is no mappings artifact.
minecraft_version=26.2
fabric_loader_version=0.19.3
fabric_version=0.156.0+26.2
loom_version=1.17-SNAPSHOT
shadow_version=9.6.1

# Java toolchain — read by build.gradle, fabric.mod.json and the mixins json. One place to bump.
java_version=25


# Mod Properties
mod_version = 0.5.0
mod_name = RainbowKittyTweaks
mod_description = A collection of small Fabric mods for the Rainbow Kitty Club server.
mod_authors = ["Kalic0"]
mod_website = https://github.com/Kalic0/RainbowKittyTweaks
mod_issues = https://github.com/Kalic0/RainbowKittyTweaks/issues
mod_license = CC0-1.0


# Project Properties
maven_group = club.rainbowkitty
mod_id = rktweaks
entrypoint = club.rainbowkitty.tweaks.Main